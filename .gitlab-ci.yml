stages:
  - test
  - build
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-operator-base"
  DOCKER_DOCS_IMAGE: "dulno-operator-docs"

include:
  - project: 'dulno/dulno-template'
    file: '/operator/operator-template.yml'

build_jar:
  stage: build
  image: gradle:9.2.0-jdk21
  script:
    - gradle bootJar
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 day

publish_gradle:
  stage: publish
  image: gradle:9.2.0-jdk21
  dependencies: []
  script:
    - gradle publish